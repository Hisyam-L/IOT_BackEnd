persistence true
persistence_location /mosquitto/data/
log_dest stdout
per_listener_settings true

# Listener untuk ESP32 (dibuka ke internet, wajib username/password)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Listener internal untuk Node-RED. TIDAK dipublikasikan di docker-compose.yml
listener 1884
allow_anonymous true
