<script type="text/javascript">
  RED.nodes.registerType('daylight-ws', {
    category: 'network',
    color: '#a6bbcf',
    defaults: {
      name: { value: '' },
      path: { value: '/ws', required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'white-globe.svg',
    label: function () { return this.name || ('WebSocket ' + this.path); }
  });
</script>

<script type="text/html" data-template-name="daylight-ws">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name">
  </div>
  <div class="form-row">
    <label for="node-input-path"><i class="fa fa-globe"></i> Path</label>
    <input type="text" id="node-input-path" placeholder="/ws">
  </div>
</script>

<script type="text/html" data-help-name="daylight-ws">
  <p>WebSocket server dengan autentikasi JWT lewat <code>?token=</code>.</p>
  <p><b>Output</b>: <code>{topic:"connect", _client}</code> saat ada klien baru.</p>
  <p><b>Input</b>: <code>msg.payload</code> (objek/string) dikirim ke semua klien, atau hanya ke
  <code>msg._client</code> bila diisi.</p>
</script>
