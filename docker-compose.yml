services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ_NAME:-Asia/Jakarta}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # tidak dipublikasikan ke internet

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"   # hanya untuk ESP32 (wajib login). Port 1884 internal saja.
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro,z
      - mosquitto_data:/mosquitto/data

  nodered:
    build: ./nodered
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      TZ: ${TZ_NAME:-Asia/Jakarta}
      TZ_NAME: ${TZ_NAME:-Asia/Jakarta}
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      DOOR_THRESHOLD_CM: ${DOOR_THRESHOLD_CM:-50}
      DOOR_HOLD_MS: ${DOOR_HOLD_MS:-3000}
      BUZZER_MS: ${BUZZER_MS:-2000}
      READING_INTERVAL_S: ${READING_INTERVAL_S:-10}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    ports:
      - "127.0.0.1:1880:1880"   # editor Node-RED hanya lewat SSH tunnel

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - nodered
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./frontend/dist:/usr/share/nginx/html:ro,z

volumes:
  pgdata:
  mosquitto_data:
