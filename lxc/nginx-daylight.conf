map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Ganti path ini sesuai lokasi root direktori repo di LXC
    root /home/hisyamlbaihaqi/kuliah/semester56/iot/smart-daylight/frontend/dist;
    index index.html;
    client_max_body_size 1m;

    # REST API -> Node-RED
    location /api/ {
        proxy_pass http://127.0.0.1:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> Node-RED (daylight-ws)
    location /ws {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Node-RED Admin/Editor (opsional jika dibuka via Nginx)
    location /admin/ {
        proxy_pass http://127.0.0.1:1880/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA (React/Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
