# Mosquitto MQTT Configuration for Bare-Metal LXC
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
log_dest stdout

per_listener_settings true

# Listener eksternal untuk ESP32 (port 1883, wajib username & password)
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd

# Listener internal untuk Node-RED (port 1884, hanya localhost/127.0.0.1)
listener 1884 127.0.0.1
allow_anonymous true
